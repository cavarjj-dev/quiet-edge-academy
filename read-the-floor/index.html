<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#14202A">
<title>Read the Floor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="gateCss">
:root{--g-bg:#EEF1EE;--g-card:#FFFFFF;--g-ink:#14202A;--g-ink2:#3E4C57;--g-line:#CBD3CE;--g-accent:#D9480F}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--g-bg:#0F161C;--g-card:#172129;--g-ink:#E7ECEA;--g-ink2:#B5C0C4;--g-line:#2C3A44;--g-accent:#F26A2E}}
html,body{margin:0}
body{background:var(--g-bg);color:var(--g-ink);font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.gate{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;box-sizing:border-box}
.gate form{width:100%;max-width:380px;background:var(--g-card);border:1px solid var(--g-line);border-radius:10px;padding:28px 24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
.gate h1{font-family:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;font-weight:900;font-size:52px;line-height:.9;margin:0;text-transform:uppercase}
.gate h1 span{color:var(--g-accent)}
.gate p{margin:0;color:var(--g-ink2);font-size:15px;line-height:1.5}
.gate input[type=password]{font:16px "IBM Plex Mono",ui-monospace,monospace;padding:12px;border:1px solid var(--g-line);border-radius:6px;background:var(--g-bg);color:var(--g-ink);width:100%;box-sizing:border-box}
.gate label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--g-ink2)}
.gate button{font:600 16px "Public Sans",system-ui,sans-serif;padding:12px;border-radius:6px;border:0;background:var(--g-ink);color:var(--g-bg);cursor:pointer}
.gate .err{color:var(--g-accent);font-size:14px;min-height:1.2em}
.gate .note{font-size:12.5px}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <form id="gateForm" autocomplete="on">
    <h1>Read the <span>Floor</span></h1>
    <p>This playbook is private. Enter the passphrase your coach gave you.</p>
    <input type="text" name="username" value="read-the-floor" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="passphrase" aria-label="Passphrase" required>
    <label class="rem"><input type="checkbox" id="remember" checked> Keep me unlocked on this device</label>
    <button type="submit" id="go">Unlock</button>
    <div class="err" id="err" role="alert"></div>
    <p class="note">Tip: spaces don't matter, capitals don't matter.</p>
  </form>
</div>

  const toUrl = s => s.replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  const fromUrl = s => { s = s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length % 4) s += "="; return s; };
  const norm = s => s.trim().toLowerCase().replace(/\s+/g, "-");

  async function derive(pass){
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({name:"PBKDF2", salt:unb64(P.salt), iterations:P.iter, hash:"SHA-256"},
      base, {name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
  }
  async function open(key){
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:unb64(P.iv)}, key, unb64(P.ct));
    return JSON.parse(dec.decode(pt));
  }
  function start(app, key){
    window.RTF = {
      async encrypt(text){
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, enc.encode(text));
        const all = new Uint8Array(12 + ct.byteLength); all.set(iv); all.set(new Uint8Array(ct), 12);
        return toUrl(b64(all));
      },
      async decrypt(token){
        const all = unb64(fromUrl(token));
        const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:all.slice(0,12)}, key, all.slice(12));
        return dec.decode(pt);
      },
      lock(){ try{ localStorage.removeItem(KEYSTORE); }catch(e){} location.reload(); }
    };
    document.getElementById("gate").remove();
    document.getElementById("gateCss").remove();
    const st = document.createElement("style"); st.textContent = app.css; document.head.appendChild(st);
    document.getElementById("app").outerHTML = app.html;
    const sc = document.createElement("script"); sc.textContent = app.js; document.body.appendChild(sc);
  }
  async function tryStored(){
    try{
      const raw = localStorage.getItem(KEYSTORE);
      if(!raw) return false;
      const key = await crypto.subtle.importKey("raw", unb64(raw), {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
      start(await open(key), key); return true;
    }catch(e){ try{ localStorage.removeItem(KEYSTORE); }catch(_){} return false; }
  }
  document.getElementById("gateForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("go"), err = document.getElementById("err");
    btn.disabled = true; btn.textContent = "Unlocking…"; err.textContent = "";
    try{
      const key = await derive(norm(document.getElementById("pw").value));
      const app = await open(key);
      if(document.getElementById("remember").checked){
        try{ localStorage.setItem(KEYSTORE, b64(await crypto.subtle.exportKey("raw", key))); }catch(_){}
      }
      start(app, key);
    }catch(x){
      err.textContent = "That passphrase didn't work. Check it and try again.";
      btn.disabled = false; btn.textContent = "Unlock";
    }
  });
  tryStored().then(ok => { if(!ok){ document.getElementById("gate").hidden = false; document.getElementById("pw").focus(); } });
})();
</script>
